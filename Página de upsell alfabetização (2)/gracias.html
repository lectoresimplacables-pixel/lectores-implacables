<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: oklch(0.97 0.01 250); }
    a { color: #0F02FE; }
    a:hover { color: #2d1fff; }
    @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,176,32,0.55); } 50% { box-shadow: 0 0 0 14px rgba(255,176,32,0); } }
  </style>
</helmet>

<div style="font-family: 'Nunito', sans-serif; max-width: 560px; margin: 0 auto; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center;">

  <span style="font-size: 44px;">🎉</span>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <h1 style="font-family: 'Baloo 2', sans-serif; font-size: 28px; margin: 0; color: oklch(0.28 0.05 260);">¡Gracias por responder!</h1>
    <p style="font-size: 16px; line-height: 1.5; margin: 0; color: oklch(0.4 0.03 260);">
      Tu respuesta nos ayuda a crear mejores materiales de alfabetización. Recuerda: el producto más votado será sorteado y ¡podrías ganarlo! 🎁
    </p>
  </div>

  <a href="https://drive.google.com/drive/folders/1h4HV0O9EwOPi5_qv6ULt3iabr28a59wT?hl=fr" style="animation: pulseGlow 2s infinite; text-decoration: none; width: 100%; box-sizing: border-box; background: #0F02FE; color: white; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px; text-align: center; padding: 20px 24px; border-radius: 14px; box-shadow: 0 8px 20px rgba(15,2,254,0.35); display: block;">
    🎁 ACCEDER A MIS 100 ACTIVIDADES
  </a>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 600}}"></script>
</body>
</html>
